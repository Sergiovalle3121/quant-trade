# Strict low/mid-cap crypto research gate. These values are mirrored by the
# immutable ExperimentSpec and the fail-closed crypto PromotionVerdict. A pass
# advances only to shadow/paper validation and never authorizes real money.
# Both the absolute drawdown cap and the relative cap against each sealed
# benchmark apply; neither substitutes for the other.

min_test_sharpe: 0.5
min_excess_return: 0.0
max_test_drawdown: 0.25
max_drawdown_ratio_vs_benchmark: 1.0
max_turnover: 3.0
require_beats_benchmark: true
require_cost_sensitivity_pass: true
require_subperiod_pass: false
require_no_red_flags: false
min_test_months: 12
max_train_test_sharpe_gap: 1.0
min_trade_count: 30
min_probabilistic_sharpe: 0.95
require_deflated_sharpe: true
min_deflated_sharpe: 0.95
require_walk_forward_overfitting_evidence: true
max_walk_forward_pbo: 0.10
min_walk_forward_windows: 4
