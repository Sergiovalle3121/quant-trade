# Regenerates the committed artifact sets on Linux and uploads them as a
# workflow artifact for the operator to download and commit.
#
# Exists because artifact bytes must be Linux-authoritative (the
# artifact-integrity job diffs against a Linux regeneration) while the
# development machine is Windows — and, at the time of writing, a Windows
# Application Control policy blocks pandas there, so some generators cannot
# run locally at all. This never commits or pushes anything itself.
name: Regenerate artifacts

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regenerate every artifact set in place
        run: |
          set -euo pipefail
          v7=$(python -c "import json;print(json.load(open('artifacts/v7/PROMOTION_REPRODUCIBILITY.json'))['source_commit_sha'])")
          v8=$(python -c "import json;print(json.load(open('artifacts/v8/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          v9=$(python -c "import json;print(json.load(open('artifacts/v9/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          python -m quant_trade.v7_artifacts --repo-root . --output-dir artifacts/v7 --source-commit-sha "$v7"
          quant-trade v8 revenue-run --repo-root . --evidence-root data/v8_evidence --out-dir artifacts/v8 --source-commit-sha "$v8"
          quant-trade v9 artifacts --repo-root . --evidence-root data/v9_evidence --out-dir artifacts/v9 --source-commit-sha "$v9"
      - name: Show what changed
        run: git diff --stat -- artifacts/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-artifacts
          path: artifacts/
          if-no-files-found: error
