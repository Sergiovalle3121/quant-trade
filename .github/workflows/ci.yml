name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -c requirements.lock.txt -e ".[cloud,data,dev,crypto]"
      - name: Ruff
        run: ruff check .
      - name: V7 format check
        run: xargs ruff format --check < .github/v7-python-files.txt
      - name: V8 format check
        run: xargs ruff format --check < .github/v8-python-files.txt
      - name: V9 format check
        run: xargs ruff format --check < .github/v9-python-files.txt
      - name: Crypto safety format check
        run: >-
          ruff format --check
          src/quant_trade/data/crypto_panel.py
          src/quant_trade/data/crypto_market_events.py
          src/quant_trade/data/venue_klines.py
          src/quant_trade/data/crypto_selection.py
          src/quant_trade/data/crypto_stablecoin_evidence.py
          src/quant_trade/data/binance_symbol_rules.py
          src/quant_trade/data/aanv30_feasibility.py
          src/quant_trade/data/world_order_flow_feasibility.py
          src/quant_trade/data/ccdata_attested_loader.py
          src/quant_trade/data/alpaca_spy_tom_collector.py
          src/quant_trade/costs/crypto_lowcap.py
          src/quant_trade/ops/crypto_capital.py
          src/quant_trade/ops/crypto_gates.py
          src/quant_trade/ops/wealth_cli.py
          src/quant_trade/ops/wealth_plan.py
          src/quant_trade/ops/tax_lot_ledger.py
          src/quant_trade/execution/alpaca_campaign_sleeve.py
          src/quant_trade/data/crypto_manifest.py
          src/quant_trade/research/crypto_economic_evidence.py
          src/quant_trade/research/crypto_evaluator.py
          src/quant_trade/research/crypto_governance.py
          src/quant_trade/research/crypto_runner.py
          src/quant_trade/research/runtime_provenance.py
          src/quant_trade/research/crypto_route_guard.py
          src/quant_trade/research/holdout_seal.py
          src/quant_trade/research/prospective_crypto.py
          src/quant_trade/research/prospective_development.py
          src/quant_trade/research/prospective_weekly_momentum.py
          src/quant_trade/research/prospective_weekly_development.py
          src/quant_trade/research/prospective_xsmom.py
          src/quant_trade/research/prospective_xsmom_development.py
          src/quant_trade/research/prospective_carry_feasibility.py
          src/quant_trade/research/prospective_spy_tom.py
          src/quant_trade/research/prospective_spy_tom_development.py
          src/quant_trade/research/signals/crypto_lowcap.py
          src/quant_trade/audit
          tests/test_committed_crypto_invalidation.py
          tests/test_crypto_evaluator.py
          tests/test_crypto_economic_evidence.py
          tests/test_crypto_capital.py
          tests/test_crypto_gates.py
          tests/test_crypto_governance.py
          tests/test_crypto_legacy_guards.py
          tests/test_crypto_manifest.py
          tests/test_crypto_market_events.py
          tests/test_crypto_panel.py
          tests/test_venue_klines.py
          tests/test_crypto_selection.py
          tests/test_crypto_stablecoin_evidence.py
          tests/test_binance_symbol_rules.py
          tests/test_aanv30_feasibility.py
          tests/test_world_order_flow_feasibility.py
          tests/test_ccdata_attested_loader.py
          tests/test_ccdata_procurement_contract.py
          tests/test_alpaca_spy_tom_collector.py
          tests/test_crypto_runner.py
          tests/test_crypto_lowcap_signals.py
          tests/test_crypto_lowcap_costs.py
          tests/test_holdout_seal.py
          tests/test_prospective_crypto.py
          tests/test_prospective_development.py
          tests/test_prospective_weekly_momentum.py
          tests/test_prospective_weekly_development.py
          tests/test_prospective_xsmom.py
          tests/test_prospective_xsmom_development.py
          tests/test_prospective_carry_feasibility.py
          tests/test_alpaca_campaign_sleeve.py
          tests/test_prospective_spy_tom.py
          tests/test_prospective_spy_tom_development.py
          tests/test_runtime_provenance.py
          tests/test_audit_cli.py
          tests/test_audit_models.py
          tests/test_audit_runner.py
          tests/test_wealth_cli.py
          tests/test_wealth_plan.py
          tests/test_tax_lot_ledger.py
      - name: Mypy
        run: mypy src
      - name: Diff whitespace check
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git diff --check "origin/${base_ref}...HEAD"

  # A committed artifact must be exactly what its generator emits. V7 had this
  # check and V8/V9 did not, which is how honest generators and lying artifacts
  # coexisted in main without anything going red. Running it on Linux is also
  # the reference for path serialisation: a generator that emits a platform
  # separator produces a diff here.
  artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -c requirements.lock.txt -e ".[cloud,data,dev,crypto]"
      - name: Regenerate every artifact set in place
        run: |
          set -euo pipefail
          v7=$(python -c "import json;print(json.load(open('artifacts/v7/PROMOTION_REPRODUCIBILITY.json'))['source_commit_sha'])")
          v8=$(python -c "import json;print(json.load(open('artifacts/v8/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          v9=$(python -c "import json;print(json.load(open('artifacts/v9/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          python -m quant_trade.v7_artifacts --repo-root . --output-dir artifacts/v7 --source-commit-sha "$v7"
          quant-trade v8 revenue-run --repo-root . --evidence-root data/v8_evidence --out-dir artifacts/v8 --source-commit-sha "$v8"
          quant-trade v9 artifacts --repo-root . --evidence-root data/v9_evidence --out-dir artifacts/v9 --source-commit-sha "$v9"
      - name: Fail if any committed artifact drifted from its generator
        run: |
          if ! git diff --exit-code -- artifacts/; then
            echo "::error::A committed artifact does not match what its generator emits."
            echo "::error::Regenerate artifacts/ in the same commit as the source change."
            exit 1
          fi
      # On drift, ship the Linux-authoritative bytes so the operator can commit
      # them without regenerating locally — the committed artifacts must match
      # a Linux regeneration, and the development machine may not be able to
      # produce one (Windows, or a policy blocking native extensions).
      - name: Upload the Linux regeneration on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-regenerated-artifacts
          path: artifacts/
          if-no-files-found: error
      - name: Provenance guard report
        run: python -m quant_trade.evidence.provenance_guard --repo-root .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -c requirements.lock.txt -e ".[cloud,data,dev,crypto]"
      - name: Compile smoke check
        run: python -m compileall -q src tests
      - name: Pytest
        run: pytest -q

  critical-safety-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -c requirements.lock.txt -e ".[cloud,data,dev,crypto]"
      - name: Enforce critical crypto safety branch coverage
        run: |
          pytest -q \
            tests/test_crypto_capital.py \
            tests/test_crypto_gates.py \
            tests/test_tax_lot_ledger.py \
            tests/test_crypto_manifest.py \
            tests/test_crypto_market_events.py \
            tests/test_crypto_selection.py \
            tests/test_crypto_stablecoin_evidence.py \
            tests/test_binance_symbol_rules.py \
            tests/test_aanv30_feasibility.py \
            tests/test_world_order_flow_feasibility.py \
            tests/test_ccdata_attested_loader.py \
            tests/test_ccdata_procurement_contract.py \
            tests/test_alpaca_spy_tom_collector.py \
            tests/test_crypto_lowcap_costs.py \
            tests/test_crypto_panel.py \
            tests/test_crypto_evaluator.py \
            tests/test_crypto_economic_evidence.py \
            tests/test_crypto_lowcap_signals.py \
            tests/test_crypto_runner.py \
            tests/test_holdout_seal.py \
            tests/test_crypto_governance.py \
            tests/test_crypto_legacy_guards.py \
            tests/test_prospective_crypto.py \
            tests/test_prospective_development.py \
            tests/test_prospective_weekly_momentum.py \
            tests/test_prospective_weekly_development.py \
            tests/test_prospective_xsmom.py \
            tests/test_prospective_xsmom_development.py \
            tests/test_prospective_carry_feasibility.py \
            tests/test_alpaca_campaign_sleeve.py \
            tests/test_prospective_spy_tom.py \
            tests/test_prospective_spy_tom_development.py \
            tests/test_runtime_provenance.py \
            --cov=src/quant_trade \
            --cov-branch \
            --cov-report=
          coverage report \
            --include='src/quant_trade/ops/crypto_capital.py,src/quant_trade/ops/crypto_gates.py,src/quant_trade/ops/tax_lot_ledger.py,src/quant_trade/execution/alpaca_campaign_sleeve.py,src/quant_trade/costs/crypto_lowcap.py,src/quant_trade/data/crypto_manifest.py,src/quant_trade/data/crypto_panel.py,src/quant_trade/data/crypto_market_events.py,src/quant_trade/data/crypto_selection.py,src/quant_trade/data/crypto_stablecoin_evidence.py,src/quant_trade/data/binance_symbol_rules.py,src/quant_trade/data/aanv30_feasibility.py,src/quant_trade/data/world_order_flow_feasibility.py,src/quant_trade/data/ccdata_attested_loader.py,src/quant_trade/data/alpaca_spy_tom_collector.py,src/quant_trade/research/crypto_economic_evidence.py,src/quant_trade/research/crypto_evaluator.py,src/quant_trade/research/crypto_runner.py,src/quant_trade/research/runtime_provenance.py,src/quant_trade/research/crypto_route_guard.py,src/quant_trade/research/prospective_crypto.py,src/quant_trade/research/prospective_development.py,src/quant_trade/research/prospective_weekly_momentum.py,src/quant_trade/research/prospective_weekly_development.py,src/quant_trade/research/prospective_xsmom.py,src/quant_trade/research/prospective_xsmom_development.py,src/quant_trade/research/prospective_carry_feasibility.py,src/quant_trade/research/prospective_spy_tom.py,src/quant_trade/research/prospective_spy_tom_development.py,src/quant_trade/research/signals/crypto_lowcap.py,src/quant_trade/research/holdout_seal.py,src/quant_trade/research/crypto_governance.py' \
            --show-missing \
            --fail-under=80

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the same locked dependency set used by CI
        run: >-
          python -m pip install -c requirements.lock.txt
          -e ".[cloud,data,dev,crypto]"
          "pip-audit==2.10.1"
      - name: Audit that locked dependency set
        run: >-
          python -m pip_audit
          --requirement requirements.lock.txt
          --strict
          --progress-spinner off

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the check read-only and never upload a report that could
          # contain secret-adjacent match context. The job log stays redacted.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
