name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: V7 format check
        run: xargs ruff format --check < .github/v7-python-files.txt
      - name: V8 format check
        run: xargs ruff format --check < .github/v8-python-files.txt
      - name: Mypy
        run: mypy src
      - name: Diff whitespace check
        run: git diff --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile smoke check
        run: python -m compileall -q src tests
      - name: Pytest
        run: pytest -q
