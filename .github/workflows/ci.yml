name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: V7 format check
        run: xargs ruff format --check < .github/v7-python-files.txt
      - name: V8 format check
        run: xargs ruff format --check < .github/v8-python-files.txt
      - name: V9 format check
        run: xargs ruff format --check < .github/v9-python-files.txt
      - name: Mypy
        run: mypy src
      - name: Diff whitespace check
        run: git diff --check

  # A committed artifact must be exactly what its generator emits. V7 had this
  # check and V8/V9 did not, which is how honest generators and lying artifacts
  # coexisted in main without anything going red. Running it on Linux is also
  # the reference for path serialisation: a generator that emits a platform
  # separator produces a diff here.
  artifact-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regenerate every artifact set in place
        run: |
          set -euo pipefail
          v7=$(python -c "import json;print(json.load(open('artifacts/v7/PROMOTION_REPRODUCIBILITY.json'))['source_commit_sha'])")
          v8=$(python -c "import json;print(json.load(open('artifacts/v8/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          v9=$(python -c "import json;print(json.load(open('artifacts/v9/REGENERATION_MANIFEST.json'))['source_commit_sha'])")
          python -m quant_trade.v7_artifacts --repo-root . --output-dir artifacts/v7 --source-commit-sha "$v7"
          quant-trade v8 revenue-run --repo-root . --evidence-root data/v8_evidence --out-dir artifacts/v8 --source-commit-sha "$v8"
          quant-trade v9 artifacts --repo-root . --evidence-root data/v9_evidence --out-dir artifacts/v9 --source-commit-sha "$v9"
      - name: Fail if any committed artifact drifted from its generator
        run: |
          if ! git diff --exit-code -- artifacts/; then
            echo "::error::A committed artifact does not match what its generator emits."
            echo "::error::Regenerate artifacts/ in the same commit as the source change."
            exit 1
          fi
      # On drift, ship the Linux-authoritative bytes so the operator can commit
      # them without regenerating locally — the committed artifacts must match
      # a Linux regeneration, and the development machine may not be able to
      # produce one (Windows, or a policy blocking native extensions).
      - name: Upload the Linux regeneration on drift
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-regenerated-artifacts
          path: artifacts/
          if-no-files-found: error
      - name: Provenance guard report
        run: python -m quant_trade.evidence.provenance_guard --repo-root .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile smoke check
        run: python -m compileall -q src tests
      - name: Pytest
        run: pytest -q
